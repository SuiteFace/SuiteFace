<script>/* Day Play / Night Play. Runs in <head> so the page never flashes the wrong theme.
   Auto (default) follows Central Time: Day Play 7:00 am–6:59 pm, Night Play 7:00 pm–6:59 am, switching live.
   A visitor can pin Day or Night; the choice is kept on this device. The Joker Lobby is always Night Play. */
(function () {
  var KEY = "sf.play", root = document.documentElement, pinned = null;
  var nightOnly = /joker-lobby/.test(location.pathname);
  try { pinned = localStorage.getItem(KEY); } catch (e) { }
  if (pinned !== "day" && pinned !== "night") pinned = null;
  function centralHour() {
    try { return +new Intl.DateTimeFormat("en-US", { hour: "numeric", hourCycle: "h23", timeZone: "America/Chicago" }).format(new Date()); }
    catch (e) { return new Date().getHours(); }
  }
  function auto() { var h = centralHour(); return h >= 7 && h < 19 ? "day" : "night"; }
  function current() { return nightOnly ? "night" : pinned || auto(); }
  function apply() {
    var p = current();
    if (root.getAttribute("data-play") !== p) {
      root.setAttribute("data-play", p);
      var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute("content", p === "day" ? "#FBF6EC" : "#17151B");
      try { document.dispatchEvent(new CustomEvent("sf:play", { detail: { play: p } })); } catch (e) { }
    }
    root.setAttribute("data-play-mode", pinned || "auto");
    label();
  }
  var pill = null, menu = null;
  function label() {
    if (!pill) return;
    var p = current();
    pill.innerHTML = '<span aria-hidden="true">' + (p === "day" ? "☀️" : "🌙") + '</span><span class="t">' + (p === "day" ? "Day Play" : "Night Play") + "</span> <small>" + (pinned ? "· chosen" : "· auto") + "</small>";
    pill.setAttribute("aria-label", (p === "day" ? "Day Play" : "Night Play") + (pinned ? ", chosen by you" : ", automatic") + ". Change theme");
    if (menu) Array.prototype.forEach.call(menu.querySelectorAll("button"), function (b) { b.setAttribute("aria-checked", String((b.getAttribute("data-v") === "auto" && !pinned) || b.getAttribute("data-v") === pinned)); });
  }
  function set(v) {
    pinned = v === "day" || v === "night" ? v : null;
    try { if (pinned) localStorage.setItem(KEY, pinned); else localStorage.removeItem(KEY); } catch (e) { }
    root.classList.add("sf-play-fade"); apply();
  }
  function build() {
    if (nightOnly || document.querySelector(".sf-play")) return;
    var wrap = document.createElement("div"); wrap.className = "sf-play";
    wrap.innerHTML = '<button type="button" class="sf-play-pill" aria-haspopup="true" aria-expanded="false"></button>' +
      '<div class="sf-play-menu" role="menu" hidden>' +
      '<button type="button" role="menuitemradio" data-v="auto"><span aria-hidden="true">🕖</span>Automatic<small>Day 7 am · Night 7 pm (Central)</small></button>' +
      '<button type="button" role="menuitemradio" data-v="day"><span aria-hidden="true">☀️</span>Day Play<small>Bright and easy on the eyes outdoors</small></button>' +
      '<button type="button" role="menuitemradio" data-v="night"><span aria-hidden="true">🌙</span>Night Play<small>The card room after dark</small></button></div>';
    document.body.appendChild(wrap);
    pill = wrap.firstChild; menu = wrap.lastChild;
    function close() { menu.hidden = true; pill.setAttribute("aria-expanded", "false"); }
    pill.addEventListener("click", function () { var o = menu.hidden; menu.hidden = !o; pill.setAttribute("aria-expanded", String(o)); if (o) { var c = menu.querySelector('[aria-checked="true"]') || menu.firstChild; c.focus(); } });
    menu.addEventListener("click", function (e) { var b = e.target.closest("button[data-v]"); if (!b) return; set(b.getAttribute("data-v")); close(); pill.focus(); });
    document.addEventListener("click", function (e) { if (!wrap.contains(e.target)) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !menu.hidden) { close(); pill.focus(); } });
    label();
  }
  apply();
  setInterval(function () { if (!pinned) apply(); }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) apply(); });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
  window.SFPlay = { set: set, play: current, mode: function () { return pinned || "auto"; } };
})();
</script>
