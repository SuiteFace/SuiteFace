<script>
(function () {
  var CFG = window.SUITEFACE_CONFIG || {}, main = document.getElementById("main");
  var id = (location.search.match(/[?&]c=([0-9a-f-]{36})/i) || [])[1];
  var KIND = { friendship: "🤝 Friendship", faith: "🙏 Faith small group", prayer: "🕊️ Prayer group", service: "🧺 Service & volunteering", games: "🎲 Board games", greek: "🏛️ Greek life", alumni: "🎓 Alumni", club: "♣️ Club", sports: "🏀 Sports & fitness", hobby: "🎨 Hobbies", parents: "🧸 Parents", other: "🎰 Casino" };
  var WHO = { everyone: "Everyone welcome", men: "Men only", women: "Women only" };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function toast(t) { var d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 4200); }
  function anon(fn, args) {
    return fetch(CFG.supabaseUrl + "/rest/v1/rpc/" + fn, { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.supabaseKey, Authorization: "Bearer " + CFG.supabaseKey }, body: JSON.stringify(args || {}) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || "Error"); return j; }); });
  }
  function call(fn, args) { if (window.SF_LIVE) return window.SF_LIVE.rpc(fn, args).then(function (r) { if (r.error) throw r.error; return r.data; }); return anon(fn, args); }
  if (!id && /[?&]demo=1/.test(location.search)) {
    var demo = null; try { demo = JSON.parse(sessionStorage.getItem("sf.demoCasino") || "null"); } catch (e) { }
    if (demo) { window.__demo = demo; }
  }
  if (!id && !window.__demo) { main.innerHTML = '<h1>Pick a Casino</h1><p class="about">Find one near you, or build your own.</p><div class="row"><a class="btn gold" href="./#casinos">Find Casinos</a></div>'; return; }

  function draw(c) {
    document.title = c.name + " · SuiteFace Casino";
    var host = c.my_status === "host";
    main.innerHTML = '<div class="door" id="door"><div id="scene"></div><div class="doors" id="doors" aria-hidden="true"><i></i><i></i></div></div>' +
      '<div class="head"><div><p class="meta">' + esc(KIND[c.kind] || "Casino") + " · " + (c.host_handle ? "Hosted by @" + esc(c.host_handle) : "Hosted by a member") + " · " + c.members + " member" + (c.members === 1 ? "" : "s") + " · " + esc(WHO[c.who] || "") + "</p><h1>" + esc(c.name) + "</h1></div>" +
      '<div class="row">' + (host ? '<a class="btn gold" href="./#casinos">Run this Casino</a>' : c.my_status === "member" ? '<span class="btn ghost" aria-disabled="true">You\'re in ✓</span>' : c.my_status === "requested" ? '<span class="btn ghost" aria-disabled="true">Request sent</span>' : '<button class="btn gold" id="join" type="button">' + (c.join_mode === "open" ? "Join free" : "Ask to join") + "</button>") + "</div></div>" +
      (c.about ? '<p class="about">' + esc(c.about) + "</p>" : "") + '<p class="err" id="err" role="alert"></p>' +
      '<div id="floor"></div>' +
      (c.status !== "open" ? '<p class="note">Only you can see this Casino until it passes its name check.</p>' : "") +
      '<p class="note">Game Tables meet in public places. Never send money to anyone you meet. Covers ' + esc(c.scope === "national" ? "the whole United States" : c.scope === "states" && (c.states || []).length ? (c.states || []).join(", ") : "ZIP " + (c.zips || []).slice(0, 7).join(", ") + ((c.zips || []).length > 7 ? " and " + ((c.zips || []).length - 7) + " more" : "")) + ".</p>";
    window.SFCasino.render(document.getElementById("scene"), c);
    window.SFCasino.render(document.getElementById("floor"), c, { floor: true });
    var fl = document.querySelector("#floor .cs-ext"); if (fl) fl.remove(); // floor view shows only the tables
    // Live chat at each Game Table: members of this Casino only.
    var inCasino = c.my_status === "host" || c.my_status === "member";
    document.querySelectorAll("#floor .cs-table").forEach(function (el, i) {
      var t = (c.tables || [])[i]; if (!t || !t.id) return;
      var b = document.createElement("button"); b.type = "button"; b.className = "btn ghost tchat";
      b.textContent = inCasino ? "💬 Table chat" : "💬 Join to chat"; el.appendChild(b);
      b.onclick = function () { if (!inCasino) { toast(window.SF_LIVE ? "Join this Casino to chat at its tables." : "Log in and join this Casino to chat."); return; } openChat(t, c); };
    });
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dd = document.getElementById("doors"); if (dd) dd.classList.add("gone"); // the entrance already opened the doors
    var j = document.getElementById("join");
    if (j) j.onclick = function () {
      if (!window.SF_LIVE) { try { sessionStorage.setItem("sf.after", "casinos"); } catch (e) { } location.href = "./?login=1#casinos"; return; }
      call("join_casino", { p_casino: c.id }).then(function (st) { toast(st === "member" ? "You're in! Welcome to " + c.name + "." : "Request sent. The Host will let you in."); load(); }, function (e) { document.getElementById("err").textContent = e.message; });
    };
  }
  function openChat(t, c) {
    var old = document.getElementById("tchatBox"); if (old) old.remove();
    var host = c.my_status === "host", last = 0, timer;
    var box = document.createElement("div"); box.id = "tchatBox"; box.className = "tchatbox"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", t.name + " chat");
    box.innerHTML = '<div class="tch-head"><div><b>' + esc(t.name) + "</b><small>" + esc(t.meets || c.name) + '</small></div><button type="button" class="btn ghost" id="tchClose">Close</button></div>' +
      '<div class="tch-log" id="tchLog" aria-live="polite"><p class="note">Loading the table…</p></div>' +
      '<form class="tch-form" id="tchForm"><label class="sr" for="tchIn">Message</label><input id="tchIn" maxlength="600" autocomplete="off" placeholder="Say something to the table…"><button class="btn gold" type="submit">Send</button></form>' +
      '<p class="note">Be kind. Meet in public. Never send money. Long-press or tap ⋯ on a message to report it.</p>';
    document.body.appendChild(box);
    var log = box.querySelector("#tchLog");
    function render(rows, reset) {
      if (reset) log.innerHTML = "";
      rows.slice().reverse().forEach(function (m) {
        last = Math.max(last, m.id);
        var d = document.createElement("div"); d.className = "tch-msg" + (m.mine ? " me" : ""); d.dataset.id = m.id;
        d.innerHTML = '<span class="who">' + (m.mine ? "You" : "@" + esc(m.handle || "player")) + (m.is_host ? ' <em>Host</em>' : "") + '</span><span class="txt">' + esc(m.body) + '</span><button type="button" class="tch-more" aria-label="Message options">⋯</button>';
        log.appendChild(d);
      });
      if (!log.children.length) log.innerHTML = '<p class="note">No messages yet. Say hi to the table.</p>';
      log.scrollTop = log.scrollHeight;
    }
    function pull(reset) {
      call("table_chat", { p_table: t.id, p_after: reset ? 0 : last }).then(function (rows) { if (reset || (rows && rows.length)) { if (!reset && log.querySelector(".note")) log.innerHTML = ""; render(rows || [], reset); } }, function (e) { log.innerHTML = '<p class="err">' + esc(e.message) + "</p>"; });
    }
    pull(true); timer = setInterval(function () { if (!document.body.contains(box)) { clearInterval(timer); return; } pull(false); }, 4000);
    box.querySelector("#tchClose").onclick = function () { clearInterval(timer); box.remove(); };
    box.querySelector("#tchForm").onsubmit = function (e) {
      e.preventDefault(); var inp = box.querySelector("#tchIn"), v = inp.value.trim(); if (!v) return; inp.value = "";
      call("send_table_message", { p_table: t.id, p_body: v }).then(function () { pull(false); }, function (x) { toast(x.message); });
    };
    log.addEventListener("click", function (e) {
      var b = e.target.closest(".tch-more"); if (!b) return; var row = b.closest(".tch-msg"), id = +row.dataset.id;
      if (host && confirm("Remove this message from the table?")) { call("hide_table_message", { p_id: id }).then(function () { row.remove(); toast("Removed."); }, function (x) { toast(x.message); }); return; }
      if (!host && confirm("Report this message? Three reports hide it, and our safety team reviews every one.")) call("report_table_message", { p_id: id }).then(function () { row.classList.add("reported"); toast("Reported. Thank you."); }, function (x) { toast(x.message); });
    });
    box.querySelector("#tchIn").focus();
  }
  function load() {
    if (window.__demo) { var d0 = window.__demo; if (!entered) { entered = true; window.SFCasino.entry(d0, function () { draw(d0); var n = document.createElement("p"); n.className = "note"; n.textContent = "This is an example Casino, made up to show how yours could look."; main.prepend(n); var j0 = document.getElementById("join"); if (j0) j0.outerHTML = '<a class="btn gold" href="./#casinos">Build one like it · $21</a>'; }); } return; }
    call("casino_floor", { p_id: id }).then(function (c) {
      if (!c) { main.innerHTML = '<h1>Casino not found</h1><p class="about">It may be closed, or still waiting for its name check.</p><a class="btn gold" href="./#casinos">Find Casinos</a>'; return; }
      if (!entered) { entered = true; window.SFCasino.entry(c, function () { draw(c); }); } else draw(c);
    }, function () { main.innerHTML = '<h1>Can\'t reach the floor</h1><p class="about">Check your connection and try again.</p>'; });
  }
  var started = false, entered = false;
  function go() { if (started) return; started = true; load(); }
  document.addEventListener("sf:live", function () { started = false; go(); });
  setTimeout(go, window.__demo ? 0 : 700); // anonymous visitors don't wait long for a session
})();
</script>
